<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Space to Plus Converter</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #000;
      color: #f9fafb;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      margin-top: 20px;
    }
    textarea {
      width: 100%;
      height: 110px;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #2563eb;
    }
    button {
      margin-top: 12px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .secondary {
      background-color: #6b7280;
      margin-left: 8px;
    }
    .secondary:hover {
      background-color: #4b5563;
    }
  </style>
</head>
<body>

  <h2>URL Space / %20 to + Converter</h2>

  <label for="inputUrl">Input URL</label>
  <textarea id="inputUrl" placeholder="Paste your URL here..."></textarea>

  <label for="outputUrl">Converted URL</label>
  <textarea id="outputUrl" readonly placeholder="Converted output will appear here..."></textarea>

  <div>
    <button id="copyBtn">Copy Output</button>
    <button id="clearBtn" class="secondary">Clear</button>
  </div>

  <script>
    const inputBox = document.getElementById('inputUrl');
    const outputBox = document.getElementById('outputUrl');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');

    function convertUrl() {
      // Replaces both literal spaces and case-insensitive %20 with +
      outputBox.value = inputBox.value.replace(/(%20| )/gi, '+');
    }

    inputBox.addEventListener('input', convertUrl);

    copyBtn.addEventListener('click', () => {
      if (!outputBox.value) return;
      navigator.clipboard.writeText(outputBox.value);
      const originalText = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = originalText, 1500);
    });

    clearBtn.addEventListener('click', () => {
      inputBox.value = '';
      outputBox.value = '';
      inputBox.focus();
    });
  </script>

</body>
</html>
